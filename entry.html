<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>12 Weeks Plan</title>

<!-- App icon / "Add to Home Screen" support -->
<link rel="manifest" href="entry-manifest.json">
<link rel="icon" type="image/x-icon" href="entry-favicon.ico">
<link rel="icon" type="image/png" sizes="32x32" href="entry-favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="entry-favicon-16.png">
<link rel="apple-touch-icon" sizes="180x180" href="entry-apple-touch-icon.png">
<meta name="theme-color" content="#034245">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="12 Weeks Plan">
<meta name="mobile-web-app-capable" content="yes">
<style>
@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap');

:root{
  --bg: #DBCEC5;
  --surface: #034245;
  --surface-hi: #0B5257;
  --line: rgba(255,255,255,.14);
  --line-onbg: rgba(3,66,69,.22);
  --cyan: #4DD8E6;
  --cyan-dim: #2E8C99;
  --amber: #F0A868;
  --green: #4ECDA0;
  --red: #E8697A;
  --text: #F5F1EA;
  --text-mid: #B9CFC9;
  --text-dim: #7DA39D;
  --ink: #073B3D;
  --ink-mid: #2C4442;
  --ink-dim: #4A5D5A;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html{scroll-behavior:smooth;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:'Inter','Segoe UI',sans-serif;
  min-height:100vh;
  padding:0 0 100px;
  overscroll-behavior-y:contain;
}
.wrap{max-width:820px;margin:0 auto;padding:0 16px;}
h1{
  font-family:'Space Grotesk',sans-serif;
  font-size:24px;
  font-weight:700;
  color:var(--ink);
  margin:0 0 4px;
}
.sub{font-size:13px;color:var(--ink-dim);margin-bottom:26px;}

/* ---------- Login card ---------- */
.login-card{
  max-width:360px;
  margin:15vh auto 60px;
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:20px;
  padding:32px 28px;
  box-shadow:0 20px 50px rgba(3,66,69,.25);
}
.login-card h2{
  font-family:'Space Grotesk',sans-serif;
  font-size:19px;
  color:#fff;
  margin:0 0 6px;
}
.login-card p{font-size:12.5px;color:var(--text-dim);margin:0 0 20px;}
.login-card label{
  display:block;
  font-size:10.5px;
  color:var(--text-dim);
  font-family:'IBM Plex Mono',monospace;
  text-transform:uppercase;
  letter-spacing:.05em;
  margin-bottom:5px;
  margin-top:14px;
}
.login-card label:first-of-type{margin-top:0;}
.login-card input{
  width:100%;
  background:var(--surface-hi);
  border:1px solid var(--line);
  border-radius:12px;
  color:var(--text);
  font-family:'Inter',sans-serif;
  font-size:16px;
  padding:14px 14px;
  outline:none;
}
.login-card input:focus{border-color:var(--cyan-dim);}
.login-card .err{color:var(--red);font-size:12px;margin-top:10px;display:none;}
.login-card .ok-msg{color:var(--green);font-size:12px;margin-top:10px;display:none;}
.auth-switch{
  text-align:center;
  font-size:12px;
  color:var(--text-dim);
  margin-top:16px;
}
.auth-switch a{color:var(--cyan);text-decoration:none;font-weight:600;cursor:pointer;}
.auth-switch a:hover{text-decoration:underline;}
.btn{
  font-family:'IBM Plex Mono',monospace;
  font-size:12.5px;
  font-weight:600;
  padding:11px 18px;
  border-radius:11px;
  border:1px solid var(--line);
  background:var(--surface-hi);
  color:var(--text-mid);
  cursor:pointer;
  transition:.15s;
  min-height:40px;
}
.btn:active{transform:scale(.97);}
.btn:hover{border-color:var(--cyan-dim);color:var(--text);}
.btn.primary{background:#F2C94C;color:#4A3800;border-color:#F2C94C;width:100%;margin-top:18px;padding:14px;font-size:14px;font-weight:700;}
.btn.primary:hover{opacity:.9;}

/* ---------- Entry app ---------- */
.hidden{display:none !important;}
.topbar{
  display:flex;
  align-items:center;
  justify-content:space-between;
  position:sticky;
  top:0;
  z-index:20;
  margin:0 -16px 14px;
  padding:16px 16px 14px;
  background:linear-gradient(180deg, var(--bg) 75%, transparent);
  backdrop-filter:blur(6px);
  -webkit-backdrop-filter:blur(6px);
  border-bottom:1px solid var(--line-onbg);
}
.topbar-left{display:flex;align-items:center;gap:14px;}
.topbar-right{display:flex;flex-direction:column;align-items:flex-end;gap:6px;}
.topbar .who{font-size:11px;color:var(--ink-dim);font-family:'IBM Plex Mono',monospace;}
.entry-logo{height:34px;width:auto;object-fit:contain;}
.save-bar.top{display:none;}
.save-bar-fixed{
  position:fixed;
  left:0;right:0;bottom:0;
  z-index:30;
  padding:12px 16px calc(12px + env(safe-area-inset-bottom));
  background:linear-gradient(180deg, transparent, var(--bg) 30%);
}
.save-bar-fixed .btn.primary{
  width:100%;
  max-width:820px;
  margin:0 auto;
  display:block;
  padding:15px;
  font-size:14px;
  border-radius:14px;
  box-shadow:0 6px 20px rgba(242,201,76,.4);
}
.validation-note{
  font-size:12px;
  font-weight:700;
  color:#6B5400;
  background:rgba(242,201,76,.16);
  border:1px solid rgba(242,201,76,.3);
  border-radius:12px;
  padding:11px 14px;
  margin-bottom:14px;
  line-height:1.5;
}
.cycle-task-inline{
  font-family:'Space Grotesk',sans-serif;
  font-size:15px;
  font-weight:700;
  color:var(--ink);
}
.cycle-task-inline b{color:var(--surface);font-weight:700;}
.cycle-task-inline .sep{color:var(--ink-dim);font-weight:400;margin:0 8px;font-size:13px;}

.controls-card{
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:14px;
  padding:18px 20px;
  margin-bottom:18px;
  display:flex;
  align-items:center;
  gap:14px;
  flex-wrap:wrap;
}
.controls-card .fld{display:flex;align-items:center;gap:8px;}
.controls-card label{
  font-size:11px;
  color:var(--text-dim);
  font-family:'IBM Plex Mono',monospace;
  text-transform:uppercase;
  letter-spacing:.06em;
}
.controls-card select{
  background:var(--surface-hi);
  border:1px solid var(--line);
  border-radius:7px;
  color:var(--cyan);
  font-family:'IBM Plex Mono',monospace;
  font-size:13px;
  font-weight:600;
  padding:6px 10px;
  outline:none;
}
.controls-card .hint{font-size:11.5px;color:var(--text-dim);}
.plan-row{
  display:flex;
  align-items:baseline;
  justify-content:space-between;
  flex-wrap:wrap;
  gap:10px;
  margin-bottom:20px;
  padding-bottom:16px;
  border-bottom:1px solid var(--line-onbg);
}
.plan-title{
  font-family:'Space Grotesk',sans-serif;
  font-size:19px;
  font-weight:700;
  color:var(--ink);
  margin:0;
  letter-spacing:.03em;
}

.entry-wrap{display:flex;flex-direction:column;gap:14px;margin-bottom:20px;}
.goal-card{
  scroll-margin-top:80px;
  background:linear-gradient(160deg, var(--surface-hi) 0%, var(--surface) 100px);
  border:1px solid var(--line);
  border-left:8px solid var(--acc, var(--cyan));
  border-radius:16px;
  padding:16px 18px 18px;
  box-shadow:0 4px 16px rgba(3,66,69,.18);
  transition:transform .15s;
}
.goal-card.row-invalid{border-left-color:var(--red);box-shadow:0 4px 16px rgba(232,105,122,.2);}
.goal-card-top{
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  gap:12px;
  margin-bottom:6px;
}
.goal-card-title{color:var(--text);font-weight:700;font-size:14.5px;line-height:1.4;}
.goal-card-task{color:var(--text-mid);font-size:12.5px;margin-bottom:16px;line-height:1.5;}
.goal-card-fields{display:flex;gap:12px;margin-bottom:12px;}
.goal-card-field{display:flex;flex-direction:column;gap:6px;}
.goal-card-field.grow{flex:1;}
.goal-card-field label{
  font-size:10.5px;
  color:var(--cyan);
  font-family:'IBM Plex Mono',monospace;
  text-transform:uppercase;
  letter-spacing:.05em;
  font-weight:700;
}
.e-goal{color:var(--text);font-weight:600;font-size:13.5px;}
.e-task-ro{color:var(--text-mid);font-size:12.5px;}
.e-num{
  display:inline-block;
  font-family:'IBM Plex Mono',monospace;
  font-size:10px;
  font-weight:700;
  color:var(--cyan);
  background:rgba(77,216,230,.14);
  border-radius:5px;
  padding:2px 6px;
  margin-right:6px;
  vertical-align:middle;
}
.e-num-goal{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  min-width:30px;
  height:26px;
  font-family:'IBM Plex Mono',monospace;
  font-size:13px;
  font-weight:800;
  border-radius:7px;
  padding:0 7px;
  margin-right:9px;
  vertical-align:middle;
}
.e-avg-circle{
  width:52px;
  height:52px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  font-family:'IBM Plex Mono',monospace;
  font-size:15px;
  font-weight:800;
  border:2px solid currentColor;
  background:rgba(255,255,255,.05);
  text-align:center;
  line-height:1.1;
  flex-shrink:0;
}
.goal-card input, .goal-card textarea{
  width:100%;
  background:var(--surface-hi);
  border:1px solid var(--line);
  border-radius:10px;
  color:var(--text);
  font-family:'Inter',sans-serif;
  font-size:16px;
  padding:11px 12px;
  outline:none;
}
.goal-card input:focus, .goal-card textarea:focus{border-color:var(--cyan-dim);}
.goal-card input.progress-input{
  font-family:'IBM Plex Mono',monospace;
  font-weight:700;
  text-align:center;
  font-size:16px;
}
.goal-card .field-progress{width:110px;flex-shrink:0;}
.goal-card textarea{resize:vertical;min-height:44px;font-family:'Inter',sans-serif;font-size:14px;}

.save-bar{display:flex;justify-content:flex-end;gap:10px;}
.empty-msg{
  text-align:center;
  padding:50px 20px;
  color:var(--ink-dim);
  font-size:13.5px;
}
@media (max-width:480px){
  .goal-card-fields{flex-direction:column;}
  .goal-card .field-progress{width:100%;}
}
</style>
</head>
<body>
<div class="wrap">

  <div id="loginView">
    <div class="login-card">
      <h2 id="authTitle">Data Entry</h2>
      <p id="authSubtitle">Sign in to fill in progress updates.</p>
      <label>Email</label>
      <input type="email" id="email" autocomplete="username">
      <label>Password</label>
      <input type="password" id="password" autocomplete="current-password">
      <button class="btn primary" id="loginBtn">Sign in</button>
      <div class="err" id="loginErr"></div>
      <div class="ok-msg" id="loginOk"></div>
      <div class="auth-switch" id="forgotPwWrap">
        <a href="#" id="forgotPwLink">Forgot password?</a>
      </div>
      <div class="auth-switch" id="authSwitch">
        New here? <a href="#" id="showSignupLink">Create an account</a>
      </div>
    </div>
  </div>

  <div id="appView" class="hidden">
    <div class="topbar">
      <div class="topbar-left">
        <img src="nama-logo.png" alt="Nama Water Services" class="entry-logo">
      </div>
      <div class="topbar-right">
        <button class="btn" id="logoutBtn">Logout</button>
        <span class="who" id="whoLabel"></span>
      </div>
    </div>

    <div class="plan-row">
      <h1 class="plan-title">12 WEEKS PLAN</h1>
      <span class="cycle-task-inline" id="whichLabel">Loading assigned Cycle &amp; Task…</span>
    </div>

    <div class="validation-note">Note: If the evaluation is less than 100%, please provide a justification to complete the evaluation save process.</div>

    <div class="entry-wrap" id="entryWrap"></div>
  </div>

</div>

<div class="save-bar-fixed hidden" id="saveBarFixed">
  <button class="btn primary" id="saveBtn">Save Progress</button>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
import {
  getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, sendPasswordResetEmail, signOut, onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.13.0/firebase-auth.js";
import {
  getFirestore, collection, getDocs, doc, setDoc, getDoc, onSnapshot
} from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCObXXRAlgfajndVIz8eDsSF--F3x8FJUU",
  authDomain: "pam-dashboard-2027.firebaseapp.com",
  projectId: "pam-dashboard-2027",
  storageBucket: "pam-dashboard-2027.firebasestorage.app",
  messagingSenderId: "533576693120",
  appId: "1:533576693120:web:1284a23ef199bfa0917d65"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

let currentCycleId = null;
let currentGoals = [];
let unsubscribeCycle = null;

// ---------------- Auth ----------------
let authMode = 'signin'; // 'signin' | 'signup'

function renderAuthMode(){
  const isSignup = authMode === 'signup';
  document.getElementById('authTitle').textContent = isSignup ? 'Create Account' : 'Data Entry';
  document.getElementById('authSubtitle').textContent = isSignup
    ? 'Set an email and password to start filling in progress updates.'
    : 'Sign in to fill in progress updates.';
  document.getElementById('loginBtn').textContent = isSignup ? 'Create account' : 'Sign in';
  document.getElementById('authSwitch').innerHTML = isSignup
    ? 'Already have an account? <a href="#" id="showSignupLink">Sign in</a>'
    : 'New here? <a href="#" id="showSignupLink">Create an account</a>';
  document.getElementById('loginErr').style.display = 'none';
  document.getElementById('loginOk').style.display = 'none';
  document.getElementById('forgotPwWrap').style.display = isSignup ? 'none' : 'block';
  document.getElementById('showSignupLink').addEventListener('click', (e)=>{
    e.preventDefault();
    authMode = isSignup ? 'signin' : 'signup';
    renderAuthMode();
  });
}
renderAuthMode();

document.getElementById('loginBtn').addEventListener('click', async ()=>{
  const email = document.getElementById('email').value.trim();
  const pw = document.getElementById('password').value;
  const errEl = document.getElementById('loginErr');
  errEl.style.display = 'none';
  if(!email || !pw){
    errEl.textContent = 'Enter an email and password.';
    errEl.style.display = 'block';
    return;
  }
  try{
    if(authMode === 'signup'){
      if(pw.length < 6){
        errEl.textContent = 'Password must be at least 6 characters.';
        errEl.style.display = 'block';
        return;
      }
      await createUserWithEmailAndPassword(auth, email, pw);
    } else {
      await signInWithEmailAndPassword(auth, email, pw);
    }
  }catch(err){
    if(err.code === 'auth/email-already-in-use'){
      errEl.textContent = 'An account with this email already exists — sign in instead.';
    } else if(err.code === 'auth/weak-password'){
      errEl.textContent = 'Password is too weak — use at least 6 characters.';
    } else if(err.code === 'auth/invalid-email'){
      errEl.textContent = 'Enter a valid email address.';
    } else if(authMode === 'signup'){
      errEl.textContent = 'Could not create account: ' + err.message;
    } else {
      errEl.textContent = 'Sign-in failed — check your email and password.';
    }
    errEl.style.display = 'block';
  }
});
document.getElementById('logoutBtn').addEventListener('click', ()=> signOut(auth));

document.getElementById('forgotPwLink').addEventListener('click', async (e)=>{
  e.preventDefault();
  const email = document.getElementById('email').value.trim();
  const errEl = document.getElementById('loginErr');
  const okEl = document.getElementById('loginOk');
  errEl.style.display = 'none';
  okEl.style.display = 'none';
  if(!email){
    errEl.textContent = 'Type your email above first, then tap "Forgot password?".';
    errEl.style.display = 'block';
    return;
  }
  try{
    await sendPasswordResetEmail(auth, email);
    okEl.textContent = 'Password reset email sent — check your inbox.';
    okEl.style.display = 'block';
  }catch(err){
    if(err.code === 'auth/invalid-email'){
      errEl.textContent = 'Enter a valid email address.';
    } else if(err.code === 'auth/user-not-found'){
      errEl.textContent = 'No account found with this email.';
    } else {
      errEl.textContent = 'Could not send reset email: ' + err.message;
    }
    errEl.style.display = 'block';
  }
});

onAuthStateChanged(auth, (user)=>{
  if(user){
    document.getElementById('loginView').classList.add('hidden');
    document.getElementById('appView').classList.remove('hidden');
    document.getElementById('whoLabel').textContent = user.email || '';
    loadFixedView();
  } else {
    document.getElementById('appView').classList.add('hidden');
    document.getElementById('loginView').classList.remove('hidden');
    if(unsubscribeCycle){ unsubscribeCycle(); unsubscribeCycle = null; }
  }
});

// ---------------- Fixed Cycle/Task (set by the admin, no picker shown here) ----------------
let fixedTaskN = 1;

async function loadFixedView(){
  const label = document.getElementById('whichLabel');
  const saveBar = document.getElementById('saveBarFixed');
  try{
    const snap = await getDoc(doc(db,'settings','entryDefault'));
    if(!snap.exists()){
      label.textContent = 'No Cycle/Task has been assigned yet — ask the admin to set it.';
      document.getElementById('entryWrap').innerHTML = '';
      saveBar.classList.add('hidden');
      return;
    }
    const data = snap.data();
    currentCycleId = data.cycle ? String(data.cycle) : null;
    fixedTaskN = data.sprint || 1;
    if(!currentCycleId){
      label.textContent = 'No Cycle/Task has been assigned yet — ask the admin to set it.';
      saveBar.classList.add('hidden');
      return;
    }
    label.innerHTML = `Cycle <b>${currentCycleId}</b><span class="sep">·</span>Task <b>${fixedTaskN}</b>`;
    saveBar.classList.remove('hidden');
    subscribeToCycle(currentCycleId);
  }catch(err){
    label.textContent = 'Could not load assignment: ' + err.message;
    saveBar.classList.add('hidden');
  }
}

function subscribeToCycle(cycleId){
  if(unsubscribeCycle) unsubscribeCycle();
  const ref = doc(db,'cycles',cycleId);
  unsubscribeCycle = onSnapshot(ref, (snap)=>{
    currentGoals = snap.exists() ? (snap.data().goals || []) : [];
    renderEntryTable();
  }, (err)=>{
    console.error('Firestore listen error', err);
  });
}

// ---------------- Entry table ----------------
function getTaskNumber(){
  return fixedTaskN;
}

function goalAvg(g){
  const total = (g.tasks && g.tasks.length) ? g.tasks.length : 6;
  if(total === 0) return null;
  const sum = (g.tasks||[]).reduce((s,t)=> s + ((t && t.progress!==null && t.progress!==undefined) ? t.progress : 0), 0);
  return sum / total;
}

const GOAL_BADGE_PALETTE = [
  { bg:'#2E86AB', text:'#FFFFFF' },
  { bg:'#4ECDA0', text:'#04382B' },
  { bg:'#F0A868', text:'#4A2E00' },
  { bg:'#B39DDB', text:'#2E1A4D' },
  { bg:'#E8697A', text:'#FFFFFF' },
  { bg:'#4DD8E6', text:'#04333A' },
  { bg:'#F2C94C', text:'#4A3800' },
  { bg:'#7C9CBF', text:'#FFFFFF' }
];
function goalBadgeStyle(goalNo){
  const c = GOAL_BADGE_PALETTE[(Number(goalNo)-1) % GOAL_BADGE_PALETTE.length];
  return `background:${c.bg};color:${c.text};`;
}

function renderEntryTable(){
  const wrap = document.getElementById('entryWrap');
  if(!currentCycleId || currentGoals.length === 0){
    wrap.innerHTML = `<div class="empty-msg">No goals available for this cycle yet.</div>`;
    return;
  }
  const taskN = getTaskNumber();
  const idx = taskN - 1;
  let html = '';
  currentGoals.forEach(g=>{
    const t = (g.tasks && g.tasks[idx]) ? g.tasks[idx] : { name:'', progress:null, note:'' };
    const progVal = (t.progress===null || t.progress===undefined) ? '' : t.progress;
    const goalNo = String(g.no).padStart(2,'0');
    const taskId = t.id || `${g.no}.${taskN})`;
    const avg = goalAvg(g);
    const avgLabel = avg===null ? '—' : avg.toFixed(0)+'%';
    const avgColor = avg===null ? 'var(--text-dim)' : avg>=100 ? '#4ECDA0' : avg>=70 ? '#F0A868' : '#E8697A';
    html += `<div class="goal-card" data-goalno="${g.no}" style="--acc:${avgColor};">
      <div class="goal-card-top">
        <div class="goal-card-title"><span class="e-num-goal" style="${goalBadgeStyle(g.no)}">${goalNo}</span>${g.name}</div>
        <div class="e-avg-circle" style="color:${avgColor};" title="Average across all this goal's tasks">${avgLabel}</div>
      </div>
      <div class="goal-card-task"><span class="e-num">${taskId}</span>${t.name ? t.name : '<span style="color:var(--text-dim)">(no task set)</span>'}</div>
      <div class="goal-card-fields">
        <div class="goal-card-field field-progress">
          <label>Progress %</label>
          <input type="number" min="0" max="100" class="progress-input" value="${progVal}" placeholder="—" inputmode="numeric">
        </div>
        <div class="goal-card-field grow">
          <label>Comment</label>
          <textarea placeholder="Required if progress is under 100%">${t.note || ''}</textarea>
        </div>
      </div>
    </div>`;
  });
  wrap.innerHTML = html;
}

document.getElementById('saveBtn').addEventListener('click', async ()=>{
  if(!currentCycleId){ alert('No cycle selected.'); return; }
  const taskN = getTaskNumber();
  const idx = taskN - 1;

  // Validate first: any row below 100% must have a comment explaining why.
  let firstInvalid = null;
  document.querySelectorAll('#entryWrap .goal-card[data-goalno]').forEach(row=>{
    row.classList.remove('row-invalid');
    const progRaw = row.querySelector('.progress-input').value.trim();
    const noteVal = row.querySelector('textarea').value.trim();
    const progNum = progRaw === '' ? null : parseInt(progRaw, 10);
    const isIncomplete = progNum === null || progNum < 100;
    if(isIncomplete && noteVal === ''){
      row.classList.add('row-invalid');
      if(!firstInvalid) firstInvalid = row;
    }
  });
  if(firstInvalid){
    alert('Please provide a reason why this task is not yet 100% complete before saving.');
    firstInvalid.querySelector('textarea').focus();
    firstInvalid.scrollIntoView({behavior:'smooth', block:'center'});
    return;
  }

  document.querySelectorAll('#entryWrap .goal-card[data-goalno]').forEach(row=>{
    const no = Number(row.getAttribute('data-goalno'));
    const g = currentGoals.find(x=>x.no===no);
    if(!g) return;
    if(!g.tasks) g.tasks = [];
    while(g.tasks.length <= idx) g.tasks.push({ id:`${g.no}.${g.tasks.length+1})`, name:'', progress:null, note:'' });
    const progRaw = row.querySelector('.progress-input').value.trim();
    const noteVal = row.querySelector('textarea').value.trim();
    // Only progress + comment are ever changed — name/id stay exactly as they are.
    g.tasks[idx] = {
      ...g.tasks[idx],
      progress: progRaw==='' ? null : Math.max(0, Math.min(100, parseInt(progRaw,10))),
      note: noteVal
    };
  });
  try{
    await setDoc(doc(db,'cycles',currentCycleId), { goals: currentGoals });
    alert(`Saved Task ${taskN} progress for Cycle ${currentCycleId}.`);
  }catch(err){
    alert('Save failed:\n' + err.message);
  }
});

if('serviceWorker' in navigator){
  navigator.serviceWorker.register('sw.js').catch(err=>console.error('SW registration failed', err));
}
</script>
</body>
</html>
